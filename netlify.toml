# A hashed build asset that is not in this deploy (a tab or cached shell from a
# previous build asking for an old chunk) must be a real 404. Without this it
# falls through to the SPA fallback below and comes back as 200 HTML carrying
# the immutable one-year cache header from /assets/*, so the browser and the
# service worker both store an HTML page under a .js URL. Not forced, so files
# that do exist are still served normally. Asset handling must run before native document routing.
[[redirects]]
  from = "/assets/*"
  to = "/asset-not-found"
  status = 404

# TanStack Start's Netlify adapter owns document requests and route 404s.
# Do not restore the former blanket SPA rewrite: it bypasses the framework server.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify infers application/octet-stream for .webmanifest, which iOS can refuse
# when deciding whether a site is installable. Serve the spec type explicitly.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must never be served stale, or a device can pin itself to a
# retired build and stop receiving updates entirely.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/flags/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, s-maxage=31536000, stale-while-revalidate=2592000"

[[headers]]
  for = "/images/og/site/generated/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
