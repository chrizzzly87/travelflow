  <head>

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TravelFlow" />
    <meta name="twitter:description" content="Plan and share travel routes with timeline and map previews in TravelFlow." />
    <meta name="twitter:image" content="/api/og/site" />
    <!-- Default Latin fonts: static preloads start during HTML parse (JS-injected ones start after). -->
    <link rel="preload" href="/fonts/bricolage-grotesque/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (() => {
        // The default Latin fonts are statically preloaded above; this script only
        // adds the extra font files that non-default locales need.
        const path = window.location.pathname || '/';
        const segments = path.split('/');
        const supportedLocales = ['en', 'es', 'de', 'fr', 'pt', 'ru', 'it', 'pl', 'ko', 'fa', 'ur'];
        let locale = 'en';
        if (segments.length > 1 && supportedLocales.includes(segments[1])) {
          locale = segments[1];
        } else {
          try {
            const stored = window.localStorage.getItem('tf_app_language');
            if (stored && supportedLocales.includes(stored)) {
              locale = stored;
            }
          } catch (e) {}
        }

        const preloads = [];
        if (['ru'].includes(locale)) {
          preloads.push({ href: '/fonts/noto-fallback/noto-sans-cyrillic.woff2', as: 'font', type: 'font/woff2' });
          preloads.push({ href: '/fonts/noto-fallback/noto-sans-cyrillic-ext.woff2', as: 'font', type: 'font/woff2' });
        } else if (['fa', 'ur'].includes(locale)) {
          preloads.push({ href: '/fonts/vazirmatn/vazirmatn-arabic-400-normal.woff2', as: 'font', type: 'font/woff2' });
          preloads.push({ href: '/fonts/vazirmatn/vazirmatn-arabic-700-normal.woff2', as: 'font', type: 'font/woff2' });
          preloads.push({ href: '/fonts/vazirmatn/vazirmatn-arabic-800-normal.woff2', as: 'font', type: 'font/woff2' });
        } else if (['pl'].includes(locale)) {
          preloads.push({ href: '/fonts/bricolage-grotesque/bricolage-grotesque-latin-ext.woff2', as: 'font', type: 'font/woff2' });
          preloads.push({ href: '/fonts/space-grotesk/space-grotesk-latin-ext.woff2', as: 'font', type: 'font/woff2' });
        }
        // Korean uses system fonts; all other locales are covered by the static Latin preloads.

        preloads.forEach(p => {
          const link = document.createElement('link');
          link.rel = 'preload';
          link.href = p.href;
          link.as = p.as;
          link.type = p.type;
          link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        });
      })();
    </script>
    <style>
      /* Custom scrollbar for the timeline */
      .timeline-scroll::-webkit-scrollbar {
        height: 8px;
        width: 8px;
        background-color: #f3f4f6;
      }
      .timeline-scroll::-webkit-scrollbar-thumb {
        background-color: #d1d5db;
        border-radius: 4px;
      }
      body {
        overscroll-behavior-y: none;
        margin: 0;
        background: #ffffff;
        color: #0f172a;
      }

      #root {
        min-height: 100vh;
      }
    </style>
    <!-- Boot-shell styles: stripped from prerendered pages by scripts/prerender-routes.mjs. -->
    <style data-tf-boot-shell-css>
      #app-bootstrap-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        background: #ffffff;
        overflow: hidden;
      }

      .tf-boot-shell {
        min-height: 100vh;
        width: 100%;
        background: #ffffff;
        color: #0f172a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;

        --tf-bone: #e4eaf2;
        --tf-bone-quiet: #edf1f7;
        --tf-bone-edge: #d7e0ec;
        --tf-bone-hairline: #eef2f7;
        --tf-bone-accent: rgba(79, 70, 229, 0.14);
      }

      .tf-boot-shell[data-tf-surface-mode="neutral"] {
        background: #f8fafc;
      }

      /*
       * A bone is a flat fill; the highlight rides a pseudo-element on a
       * transform, so it animates on the compositor instead of repainting a
       * gradient every frame the way `background-position` does. Each bone can
       * be offset into the cycle with --tf-bone-phase, which turns a row of
       * placeholders into a soft wave rather than one synchronised flash.
       */
      .tf-bone {
        position: relative;
        overflow: hidden;
        border-radius: 999px;
        background-color: var(--tf-bone);
      }

      .tf-bone::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.72) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transform: translate3d(-160%, 0, 0);
        animation: tf-boot-sweep 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        /* --tf-boot-sweep-epoch is how long this document has been open. The
           shell is remounted two or three times per navigation, and without
           this every placeholder would snap back to the start of the sweep on
           each remount. A negative delay offsets an infinite animation's phase,
           so the loop simply carries on. */
        animation-delay: calc(
          var(--tf-bone-phase, 0) * -200ms - var(--tf-boot-sweep-epoch, 0ms)
        );
      }

      /* The hold at the end is the point: one short pass, then a beat of
         stillness, instead of a placeholder that strobes without pause. */
      @keyframes tf-boot-sweep {
        0%        { transform: translate3d(-160%, 0, 0); }
        58%, 100% { transform: translate3d(160%, 0, 0); }
      }

      .tf-boot-header {
        border-bottom: 1px solid rgba(226, 232, 240, 0.7);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
      }

      .tf-boot-header-inner {
        max-width: 80rem;
        box-sizing: border-box;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-inline: 20px;
        padding-block: 16px;
      }

      .tf-boot-brand {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        flex: 0 0 auto;
      }

      .tf-boot-logo-frame {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 28px;
        width: 28px;
        border-radius: 6px;
        background: #4f46e5;
      }

      .tf-boot-logo-image {
        height: 16px;
        width: 16px;
        display: block;
      }

      .tf-boot-wordmark {
        font-size: 1.125rem;
        line-height: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #0f172a;
      }

      .tf-boot-nav {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 16px;
        min-width: 0;
        flex: 0 0 auto;
        margin-inline: auto;
      }

      .tf-boot-nav-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        height: 20px;
        pointer-events: none;
      }

      .tf-boot-nav-ghost {
        border-radius: 999px;
        background-color: var(--tf-bone);
      }

      .tf-boot-nav-skeleton--features,
      .tf-boot-nav-ghost--features { width: 64px; height: 12px; }
      .tf-boot-nav-skeleton--inspirations,
      .tf-boot-nav-ghost--inspirations { width: 78px; height: 12px; }
      .tf-boot-nav-skeleton--updates,
      .tf-boot-nav-ghost--updates { width: 110px; height: 12px; }
      .tf-boot-nav-skeleton--blog,
      .tf-boot-nav-ghost--blog { width: 34px; height: 12px; }
      .tf-boot-nav-skeleton--pricing,
      .tf-boot-nav-ghost--pricing { width: 52px; height: 12px; }

      .tf-boot-control-flag {
        width: 18px;
        height: 12px;
        border-radius: 4px;
      }

      .tf-boot-control-skeleton--locale {
        width: 56px;
        height: 12px;
      }

      .tf-boot-control-skeleton--login {
        width: 40px;
        height: 12px;
      }

      .tf-boot-control-skeleton--cta {
        width: 68px;
        height: 12px;
        background-color: rgba(255, 255, 255, 0.72);
      }

      .tf-boot-control-skeleton--cta::after {
        animation: none;
      }

      .tf-boot-actions {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .tf-boot-action-burger {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 0.5rem;
        background: transparent;
        box-shadow: none;
        pointer-events: none;
      }

      .tf-boot-action-burger-icon {
        width: 22px;
        height: 22px;
        color: #64748b;
      }

      .tf-boot-action-chip,
      .tf-boot-action-button {
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        border: 1px solid #e2e8f0;
        background-color: rgba(255, 255, 255, 0.96);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        border-radius: 8px;
        white-space: nowrap;
        pointer-events: none;
      }

      .tf-boot-nav-link--ghost,
      .tf-boot-action-chip--ghost,
      .tf-boot-action-button--ghost {
        visibility: hidden;
      }

      .tf-boot-action-chip {
        height: 36px;
        padding-inline: 12px;
        color: transparent;
      }

      .tf-boot-action-chip--locale {
        display: none;
        gap: 8px;
        width: 115px;
        height: 40px;
      }

      .tf-boot-action-chip--login {
        width: 62px;
        height: 38px;
      }

      .tf-boot-action-button {
        height: 36px;
        width: 99px;
        padding-inline: 12px;
        background: rgba(79, 70, 229, 0.9);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        border-color: rgba(79, 70, 229, 0.36);
        color: transparent;
      }

      .tf-boot-header--trip {
        display: none;
      }

      html[data-tf-boot-route="trip"] .tf-boot-header--marketing {
        display: none;
      }

      html[data-tf-boot-route="trip"] .tf-boot-header--trip {
        display: block;
      }

      /* ---- trip header: mirrors components/tripview/TripViewHeader ---- */

      .tf-boot-trip-header {
        border-bottom: 1px solid #e5e7eb;
        background: #ffffff;
      }

      .tf-boot-trip-header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 75px;
        padding: 10px 24px;
      }

      .tf-boot-trip-header-start {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1 1 auto;
      }

      .tf-boot-trip-brand {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex: 0 0 auto;
      }

      .tf-boot-trip-divider {
        height: 24px;
        width: 1px;
        background: #e5e7eb;
        margin-inline: 6px;
        flex: 0 0 auto;
      }

      .tf-boot-trip-copy {
        display: grid;
        gap: 7px;
        min-width: 0;
        flex: 1 1 auto;
        padding-block: 4px;
      }

      .tf-boot-line {
        height: 14px;
      }

      .tf-boot-line--trip-title {
        width: min(320px, 46vw);
        height: 20px;
      }

      .tf-boot-line--trip-meta {
        width: min(240px, 34vw);
        height: 13px;
        background-color: var(--tf-bone-quiet);
      }

      .tf-boot-trip-header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .tf-boot-trip-action-pill,
      .tf-boot-trip-action-square,
      .tf-boot-trip-action-primary {
        border-radius: 6px;
        height: 40px;
      }

      .tf-boot-trip-action-pill { width: 104px; }
      .tf-boot-trip-action-square { width: 40px; }

      .tf-boot-trip-action-primary {
        width: 96px;
        background-color: var(--tf-bone-accent);
      }

      /* ---- planner: mirrors components/tripview/TripViewPlannerWorkspace ---- */

      .tf-boot-planner {
        display: flex;
        height: calc(100vh - 76px);
        height: calc(100dvh - 76px);
        background: #ffffff;
        /* `both` holds the placeholders invisible through the delay, so a load
           that resolves inside ~150ms never flashes a skeleton at all.
           --tf-boot-epoch discounts the time an earlier shell in the same
           loading episode was already on screen, so a remount resumes the fade
           instead of replaying it. */
        animation-name: tf-boot-bones-in;
        animation-duration: 280ms;
        animation-timing-function: ease-out;
        animation-delay: calc(150ms - var(--tf-boot-epoch, 0ms));
        animation-fill-mode: both;
      }

      @keyframes tf-boot-bones-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* Map above, timeline below — the source order is reversed so the
         timeline stays first for anything reading the document. */
      .tf-boot-planner[data-tf-boot-layout="vertical"] {
        flex-direction: column-reverse;
      }

      .tf-boot-planner-grip {
        flex: 0 0 auto;
        background: #f3f4f6;
      }

      .tf-boot-planner:not([data-tf-boot-layout="vertical"]) > .tf-boot-planner-grip {
        width: 8px;
      }

      .tf-boot-planner[data-tf-boot-layout="vertical"] > .tf-boot-planner-grip {
        height: 8px;
      }

      /* The real map paints as one flat field until its tiles arrive, so the
         placeholder does too: a shimmer across half the viewport would be the
         loudest thing on the page. */
      .tf-boot-planner-map {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        background-color: #f1f5f9;
        background-image: linear-gradient(170deg, rgba(255, 255, 255, 0.5) 0%, rgba(241, 245, 249, 0) 58%);
      }

      .tf-boot-map-controls {
        position: absolute;
        top: 16px;
        inset-inline-end: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .tf-boot-map-control {
        height: 40px;
        width: 40px;
        border-radius: 8px;
        border: 1px solid var(--tf-bone-edge);
        background: #ffffff;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.07);
      }

      .tf-boot-map-control--accent {
        background: var(--tf-bone-accent);
        border-color: rgba(79, 70, 229, 0.16);
      }

      .tf-boot-planner-timeline {
        position: relative;
        flex: 0 0 auto;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #ffffff;
        border-inline-end: 1px solid #e5e7eb;
      }

      .tf-boot-planner:not([data-tf-boot-layout="vertical"]) > .tf-boot-planner-timeline {
        width: var(--tf-boot-sidebar-width, 560px);
        max-width: 62%;
        min-width: 340px;
        height: 100%;
      }

      .tf-boot-planner[data-tf-boot-layout="vertical"] > .tf-boot-planner-timeline {
        width: 100%;
        height: var(--tf-boot-timeline-height, 400px);
        max-height: 62%;
        border-inline-end: 0;
        border-top: 1px solid #e5e7eb;
      }

      /* 32px matches the timeline's own left gutter, so the day grid lands
         where the real one does and the handoff does not shift sideways. */
      .tf-boot-tl-track {
        padding-inline-start: 32px;
        height: 100%;
      }

      .tf-boot-tl-months {
        display: flex;
        height: 31px;
      }

      .tf-boot-tl-month {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef2ff;
        border-inline-end: 1px solid #e0e7ff;
      }

      .tf-boot-tl-month > span {
        height: 10px;
        width: 86px;
        border-radius: 999px;
        background-color: rgba(99, 102, 241, 0.16);
      }

      .tf-boot-tl-days {
        display: flex;
        height: 47px;
        border-bottom: 1px solid var(--tf-bone-hairline);
      }

      .tf-boot-tl-day {
        flex: 0 0 auto;
        width: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-inline-end: 1px solid #f1f5f9;
        background: rgba(248, 250, 252, 0.7);
      }

      .tf-boot-tl-day > span {
        height: 11px;
        width: 18px;
        border-radius: 999px;
        background-color: var(--tf-bone-quiet);
      }

      .tf-boot-tl-body {
        position: relative;
        height: calc(100% - 78px);
        padding-top: 26px;
        background-image: repeating-linear-gradient(90deg, transparent 0 47px, #f3f6fa 47px 48px);
      }

      .tf-boot-tl-label {
        height: 12px;
        background-color: var(--tf-bone-quiet);
      }

      .tf-boot-tl-label--cities { width: 118px; margin-bottom: 22px; }

      .tf-boot-tl-cities {
        display: flex;
        gap: 2px;
        height: 60px;
      }

      .tf-boot-tl-city {
        flex: 0 0 auto;
        height: 60px;
        border-radius: 8px;
        border: 2px solid var(--tf-bone-edge);
      }

      .tf-boot-tl-controls {
        position: absolute;
        top: 16px;
        inset-inline-end: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .tf-boot-tl-control-group {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 50px;
        padding: 5px;
        border-radius: 8px;
        border: 1px solid var(--tf-bone-edge);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      }

      .tf-boot-tl-control {
        height: 40px;
        width: 40px;
        border-radius: 8px;
      }

      .tf-boot-tl-control-readout {
        height: 12px;
        width: 30px;
        margin-inline: 2px;
        background-color: var(--tf-bone-quiet);
      }

      .tf-boot-tl-control--accent {
        background-color: var(--tf-bone-accent);
      }

      /* A press that landed before hydration: acknowledge it while the page wakes. */
      [data-tf-boot-pending='true'] {
        animation: tf-boot-pending-pulse 0.9s ease-in-out infinite;
      }

      @keyframes tf-boot-pending-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }

      @media (max-width: 1200px) {
        .tf-boot-header-inner {
          gap: 18px;
        }
      }

      @media (max-width: 1024px) {
        .tf-boot-planner:not([data-tf-boot-layout="vertical"]) > .tf-boot-planner-timeline {
          max-width: 58%;
        }
      }

      @media (min-width: 768px) {
        .tf-boot-action-chip--locale {
          display: inline-flex;
        }
      }

      @media (min-width: 1024px) {
        .tf-boot-header-inner {
          padding-inline: 32px;
        }

        .tf-boot-nav {
          display: flex;
        }

        .tf-boot-action-burger {
          display: none;
        }
      }

      @media (min-width: 1280px) {
        .tf-boot-nav {
          gap: 24px;
        }
      }

      /* Below `sm` the planner stacks map over timeline and the header drops
         the wordmark and the trip summary, exactly as TripViewHeader does. */
      @media (max-width: 767px) {
        .tf-boot-trip-header-inner {
          min-height: 60px;
          padding: 10px 16px;
          gap: 12px;
        }

        .tf-boot-trip-header .tf-boot-wordmark,
        .tf-boot-trip-divider,
        .tf-boot-line--trip-meta {
          display: none;
        }

        .tf-boot-line--trip-title {
          height: 18px;
          width: min(220px, 48vw);
        }

        .tf-boot-trip-action-pill {
          display: none;
        }

        .tf-boot-trip-action-primary {
          width: 40px;
        }

        .tf-boot-planner {
          height: calc(100vh - 61px);
          height: calc(100dvh - 61px);
          flex-direction: column-reverse;
        }

        .tf-boot-planner > .tf-boot-planner-grip {
          display: none;
        }

        .tf-boot-planner > .tf-boot-planner-map {
          flex: 0 0 auto;
          height: clamp(180px, 26vh, 280px);
        }

        .tf-boot-planner > .tf-boot-planner-timeline {
          width: 100%;
          height: auto;
          flex: 1 1 auto;
          max-height: none;
          min-width: 0;
          border-inline-end: 0;
          border-top: 1px solid #e5e7eb;
        }

        .tf-boot-tl-track {
          padding-inline-start: 16px;
        }

        .tf-boot-tl-controls {
          inset-inline: 16px auto;
          top: 13px;
        }

        .tf-boot-tl-control-readout {
          display: none;
        }

        .tf-boot-map-controls {
          gap: 6px;
        }
      }

      @media (max-width: 640px) {

    <!-- Pre-hydration interaction bridge. Kept on prerendered pages on purpose:
         those ship a finished-looking page whose controls are inert until the
         React tree that owns them mounts, which on a phone is seconds after
         first paint. See services/bootInteractionBridge.ts. -->
    <script data-tf-hydration-bridge>
      (() => {
        const bridge = { interacted: false, intent: null, sealed: false };
        window.__TF_BOOT__ = bridge;

        const noteInteraction = () => { bridge.interacted = true; };

        // Controls that opt in carry data-tf-boot-intent in the prerendered
        // markup. We record the intent rather than replaying the click later:
        // the component that owns the control hydrates with its own lazy chunk,
        // long after the React root mounts, so there is no moment at which a
        // re-dispatched click is reliably heard. The component reads the intent
        // on its first render instead, which cannot race.
        const rememberIntent = (event) => {
          noteInteraction();
          // Sealed once a hydrated control has read the intent: from then on the
          // page is live and React handles presses itself, so recording another
          // intent could only make a later remount act on a stale tap.
          if (bridge.sealed) return;
          const target = event.target;
          if (!target || typeof target.closest !== 'function') return;
          const control = target.closest('[data-tf-boot-intent]:not([disabled])');
          if (!control) return;
          bridge.intent = control.getAttribute('data-tf-boot-intent');
          // Visible acknowledgement: the page heard the tap, it is still waking up.
          control.setAttribute('data-tf-boot-pending', 'true');
        };

        document.addEventListener('pointerdown', noteInteraction, { capture: true, passive: true });
        document.addEventListener('keyup', noteInteraction, { capture: true, passive: true });
        window.addEventListener('scroll', noteInteraction, { capture: true, passive: true });
        document.addEventListener('click', rememberIntent, { capture: true, passive: true });
      })();
    </script>
