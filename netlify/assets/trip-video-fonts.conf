<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Existing bundled fonts keep serverless renders independent of OS fonts. -->
  <dir prefix="relative">../../public/fonts</dir>
  <cachedir>/tmp/travelflow-video-font-cache</cachedir>
  <alias><family>sans-serif</family><prefer><family>Bricolage Grotesque</family><family>Noto Sans</family><family>Vazirmatn</family></prefer></alias>
</fontconfig>
