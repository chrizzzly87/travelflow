<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>TravelFlow form registration</title></head>
<body>
  <!--
    Netlify Forms registration scaffold. Netlify's build-time form detection
    scans static HTML in the publish output; with the Next.js runtime the app
    pages are served by functions, so this static file keeps the "contact"
    form registered. (Moved from the deleted SPA index.html.)
  -->
  <form
    name="contact"
    method="POST"
    data-netlify="true"
    netlify-honeypot="bot-field"
    hidden
    aria-hidden="true"
  >
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="reason" />
    <input type="text" name="subReason" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
    <input type="text" name="currentPath" />
    <input type="text" name="lastVisitedPath" />
    <input type="text" name="locale" />
    <input type="text" name="contactSource" />
    <input type="text" name="userId" />
    <input type="text" name="plan" />
    <input type="text" name="appVersion" />
    <input type="text" name="bot-field" />
  </form>
</body>
</html>
