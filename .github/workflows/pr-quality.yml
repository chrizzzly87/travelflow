name: PR Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  pr-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Validate exactly what Netlify deploys for preview checks (PR head commit),
          # not the synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate storage registry
        run: pnpm storage:validate

      - name: Validate toast usage conventions
        run: pnpm toasts:validate

      - name: New module guard (services/config => tests checklist entry)
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail

          git fetch --no-tags --prune --depth=1 origin "${BASE_REF}"

          added_modules="$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" | grep -E '^(services|config)/' || true)"
          if [ -z "${added_modules}" ]; then
            echo "No new files added in services/ or config/."
            exit 0
          fi

          echo "New services/config files detected:"
          echo "${added_modules}"

          if ! printf '%s\n' "${PR_BODY}" | grep -Eq -- '- \[[xX]\] New module guard completed'; then
            echo "PR checklist requirement missing: check '- [x] New module guard completed'."
            exit 1
          fi

          if ! printf '%s\n' "${PR_BODY}" | grep -Eq -- 'tests/'; then
            echo "PR description must include at least one corresponding tests/** path."
            exit 1
          fi

          echo "New module guard checklist entry verified."

      - name: Run core regression tests
        run: pnpm test:core

      - name: Run build gate
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # The offline suite needs a real production build, which the step above
      # has just produced in dist/ — including dist/sw.js, which only exists
      # after prerendering. Running it here costs one browser download rather
      # than a second full build.
      #
      # It earns its place: the service worker's failure modes are invisible to
      # unit tests. A worker that ships with unsubstituted placeholders, or a
      # precache entry that 404s, installs fine in CI logs and only surfaces
      # when a real user is already offline.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run offline/PWA end-to-end suite
        run: pnpm test:e2e:pwa

      - name: Upload offline suite report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-e2e-report
          path: |
            test-results/
          retention-days: 7
          if-no-files-found: ignore
