name: PR Quality

on:
  pull_request:
    # No `edited`: nothing below reads the PR description, so retitling a PR
    # should not cost a full pipeline. The checklist gate that *does* read it
    # lives in pr-checklist.yml and runs on `edited` by itself.
    types: [opened, synchronize, reopened]

# A PR that is pushed to (or edited) several times in a row should only keep the
# newest run. Without this, three edits 20 seconds apart cost three full
# ~14-minute pipelines and queue behind each other.
concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Validate exactly what Netlify deploys for preview checks (PR head commit),
          # not the synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate storage registry
        run: pnpm storage:validate

      - name: Validate toast usage conventions
        run: pnpm toasts:validate

      - name: Run core regression tests
        run: pnpm test:core

      # `pnpm build` re-runs `pnpm test:core` internally, which the step above has
      # already done — that duplicate cost ~4.5 minutes of every run. `build:netlify`
      # is byte-for-byte `build` minus `test:core`, and it is also what Netlify
      # actually runs, so the gate now validates the real deploy command.
      - name: Run build gate
        run: pnpm build:netlify
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # The offline suite needs a real production build, which the step above
      # has just produced in dist/ — including dist/sw.js, which only exists
      # after prerendering. Running it here costs one browser download rather
      # than a second full build.
      #
      # It earns its place: the service worker's failure modes are invisible to
      # unit tests. A worker that ships with unsubstituted placeholders, or a
      # precache entry that 404s, installs fine in CI logs and only surfaces
      # when a real user is already offline.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run offline/PWA end-to-end suite
        run: pnpm test:e2e:pwa

      - name: Upload offline suite report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-e2e-report
          path: |
            test-results/
          retention-days: 7
          if-no-files-found: ignore
